<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Flow Viz</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #0f1420;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --subtle: #64748b;
    --accent: #38bdf8;
    --running: #f59e0b;
    --success: #34d399;
    --error: #f87171;
    --edge: #334155;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: 0 0 auto;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--subtle); }
  header .dot.live { background: var(--success); box-shadow: 0 0 8px var(--success); }
  header .dot.err { background: var(--error); }
  header .stat { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  header .stat b { color: var(--text); font-weight: 600; }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }

  #canvas-wrap { position: relative; flex: 1; overflow: auto; background:
      radial-gradient(circle at 1px 1px, #172033 1px, transparent 0);
      background-size: 22px 22px; }
  #flow { display: block; }

  .edge { fill: none; stroke: var(--edge); stroke-width: 2; }
  .edge.last { stroke: var(--accent); }

  .node rect.card {
    fill: var(--panel); stroke: var(--border); stroke-width: 1.5; rx: 10;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
  }
  .node.running rect.card { stroke: var(--running); }
  .node.success rect.card { stroke: #245040; }
  .node.error   rect.card { stroke: #5b2a2a; }
  .node.selected rect.card { stroke: var(--accent); stroke-width: 2; }
  .node { cursor: pointer; }

  .node .status { width: 9px; height: 9px; rx: 50%; }
  .node.running .status { fill: var(--running); animation: pulse 1s infinite; }
  .node.success .status { fill: var(--success); }
  .node.error .status { fill: var(--error); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .node .tool { font: 600 13px -apple-system, sans-serif; fill: var(--text); }
  .node .args { font: 11px var(--mono); fill: var(--muted); }
  .node .meta { font: 10px var(--mono); fill: var(--subtle); }

  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; color: var(--muted);
    pointer-events: none; text-align: center;
  }
  #empty .big { font-size: 18px; color: var(--text); font-weight: 600; }

  aside {
    width: 340px; flex: 0 0 340px; border-left: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  aside .head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  aside .body { padding: 14px 16px; overflow: auto; }
  .kv { margin-bottom: 12px; }
  .kv label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--subtle); margin-bottom: 4px; }
  .kv .val { font-family: var(--mono); font-size: 12px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; word-break: break-word; white-space: pre-wrap; max-height: 220px; overflow: auto; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    font-family: var(--mono); }
  .badge.running { background: #3a2c10; color: var(--running); }
  .badge.success { background: #0f2e23; color: var(--success); }
  .badge.error { background: #3a1717; color: var(--error); }
  .placeholder { color: var(--subtle); font-size: 12px; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="conn-dot"></span>
  <h1>Agent Flow Viz</h1>
  <span class="stat">calls <b id="stat-total">0</b></span>
  <span class="stat" style="color:var(--running)">running <b id="stat-running">0</b></span>
  <span class="stat" style="color:var(--success)">ok <b id="stat-ok">0</b></span>
  <span class="stat" style="color:var(--error)">err <b id="stat-err">0</b></span>
  <div class="spacer"></div>
  <button id="btn-clear">Clear</button>
</header>

<main>
  <div id="canvas-wrap">
    <svg id="flow" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="empty">
      <div class="big">Waiting for tool calls…</div>
      <div>Nodes appear here in call order as the agent invokes tools.</div>
    </div>
  </div>
  <aside>
    <div class="head">Call detail</div>
    <div class="body" id="detail">
      <div class="placeholder">Click a node to inspect its arguments and result.</div>
    </div>
  </aside>
</main>

<script>
(() => {
  const SVG = 'http://www.w3.org/2000/svg';
  const NODE_W = 260, ROW_H = 92, PAD_X = 40, PAD_Y = 32;

  const svg = document.getElementById('flow');
  const empty = document.getElementById('empty');
  const detail = document.getElementById('detail');
  const connDot = document.getElementById('conn-dot');

  let calls = [];
  let version = 0;
  let selectedId = null;

  const el = (name, attrs = {}) => {
    const node = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  };

  const fmtTime = (ts) => {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleTimeString('en-US', { hour12: false }) +
      '.' + String(d.getMilliseconds()).padStart(3, '0');
  };
  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"]/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const truncate = (s, n) => (s && s.length > n ? s.slice(0, n) + '…' : (s || ''));

  function layout() {
    const n = calls.length;
    const height = Math.max(n * ROW_H + PAD_Y * 2, 400);
    const width = NODE_W + PAD_X * 2;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    return { width, height };
  }

  function render() {
    const { height } = layout();
    svg.innerHTML = '';

    // Edges between consecutive nodes.
    for (let i = 1; i < calls.length; i++) {
      const y1 = PAD_Y + (i - 1) * ROW_H + 64;
      const y2 = PAD_Y + i * ROW_H + 8;
      const x = PAD_X + NODE_W / 2;
      const mid = (y1 + y2) / 2;
      const path = el('path', {
        class: 'edge' + (i === calls.length - 1 ? ' last' : ''),
        d: `M ${x} ${y1} C ${x} ${mid}, ${x} ${mid}, ${x} ${y2}`,
      });
      svg.appendChild(path);
    }

    calls.forEach((c, i) => {
      const x = PAD_X, y = PAD_Y + i * ROW_H;
      const g = el('g', {
        class: `node ${c.status}` + (c.id === selectedId ? ' selected' : ''),
        transform: `translate(${x},${y})`,
      });
      g.appendChild(el('rect', { class: 'card', width: NODE_W, height: 72 }));
      g.appendChild(el('circle', { class: 'status', cx: 18, cy: 20, r: 5 }));

      const tool = el('text', { class: 'tool', x: 32, y: 24 });
      tool.textContent = c.tool;
      g.appendChild(tool);

      const args = el('text', { class: 'args', x: 16, y: 46 });
      args.textContent = truncate(c.argsPreview, 38);
      g.appendChild(args);

      const meta = el('text', { class: 'meta', x: 16, y: 63 });
      const right = el('text', { class: 'meta', x: NODE_W - 14, 'text-anchor': 'end', y: 63 });
      if (c.status === 'running') {
        meta.textContent = '#' + (i + 1) + '  ' + fmtTime(c.startedAt);
        right.textContent = 'running…';
      } else {
        meta.textContent = '#' + (i + 1) + '  ' + fmtTime(c.startedAt);
        right.textContent = (c.durationMs ?? '?') + ' ms' + (c.status === 'error' ? '  ✕' : '  ✓');
      }
      g.appendChild(meta);
      g.appendChild(right);

      g.addEventListener('click', () => { selectedId = c.id; render(); renderDetail(); });
      svg.appendChild(g);
    });

    empty.style.display = n ? 'none' : 'flex';

    // Stats
    document.getElementById('stat-total').textContent = n;
    document.getElementById('stat-running').textContent =
      calls.filter((c) => c.status === 'running').length;
    document.getElementById('stat-ok').textContent =
      calls.filter((c) => c.status === 'success').length;
    document.getElementById('stat-err').textContent =
      calls.filter((c) => c.status === 'error').length;
  }

  function renderDetail() {
    const c = calls.find((x) => x.id === selectedId);
    if (!c) {
      detail.innerHTML = '<div class="placeholder">Click a node to inspect its arguments and result.</div>';
      return;
    }
    const rows = [
      ['Tool', `<span class="badge ${c.status}">${escapeHtml(c.status)}</span> &nbsp;${escapeHtml(c.tool)}`],
      ['Started', escapeHtml(new Date(c.startedAt).toLocaleString()) +
        (c.durationMs != null ? ` &nbsp;·&nbsp; ${c.durationMs} ms` : '')],
      ['Arguments', escapeHtml(c.argsJson || '(none)')],
    ];
    if (c.status === 'error') rows.push(['Error', escapeHtml(c.error || 'unknown error')]);
    if (c.resultPreview) rows.push(['Result preview', escapeHtml(c.resultPreview)]);
    rows.push(['Call id', escapeHtml(c.id)]);
    detail.innerHTML = rows.map(([label, val]) =>
      `<div class="kv"><label>${label}</label><div class="val">${val}</div></div>`).join('');
  }

  async function poll() {
    try {
      const res = await fetch('/api/events?since=' + version);
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      connDot.className = 'dot live';
      if (data.version !== version) {
        version = data.version;
        // Preserve selection if the call was trimmed out of the ring buffer.
        calls = data.calls;
        if (selectedId && !calls.some((c) => c.id === selectedId)) selectedId = null;
        render();
        renderDetail();
        autoScroll();
      }
    } catch {
      connDot.className = 'dot err';
    }
  }

  let stickToBottom = true;
  const wrap = document.getElementById('canvas-wrap');
  wrap.addEventListener('scroll', () => {
    stickToBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;
  });
  function autoScroll() {
    if (stickToBottom) wrap.scrollTop = wrap.scrollHeight;
  }

  document.getElementById('btn-clear').addEventListener('click', async () => {
    await fetch('/api/clear', { method: 'POST' });
    selectedId = null;
    version = 0;
    calls = [];
    render();
    renderDetail();
    poll();
  });

  render();
  poll();
  setInterval(poll, 400); // catch long-poll gaps / dropped connections
})();
</script>
</body>
</html>
